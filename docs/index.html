tablish full feature support.')}</p><a href="https://github.com/Naf1Xx/Voxel-Pulse">${t('Репозиторий проекта','Project repository')} ↗</a></article><div class="block">${status()}</div></div>`,support:()=>`<div class="wrap">${head('Поддержка','Support','Ответы на основные вопросы.','Answers to common questions.')}<div class="card"><h2>${t('Связаться с разработчиком','Contact the developer')}</h2><p>${t('Даниил — независимый разработчик Voxel Pulse.','Daniil — independent Voxel Pulse developer.')}</p><a class="btn" href="mailto:voxelpulse@outlook.com">voxelpulse@outlook.com</a></div><details><summary>${t('Нужен ли аккаунт Microsoft?','Do I need a Microsoft account?')}</summary><p>${t('Для игрового входа нужен Microsoft-аккаунт с необходимой лицензией. Подготовка сборок и часть инструментов доступны без входа.','Game sign-in requires a Microsoft account with the appropriate entitlement. Instance preparation and some tools work without sign-in.')}</p></details><details><summary>${t('Как сообщить об ошибке?','How do I report a bug?')}</summary><p>${t('Укажи версию лаунчера, шаги воспроизведения и обезличенное сообщение об ошибке. Не публикуй токены, пароли и личные данные.','Include the launcher version, reproduction steps and a redacted error message. Never publish tokens, passwords or personal data.')}</p><a class="btn" href="https://github.com/Naf1Xx/Voxel-Pulse/issues">GitHub Issues ↗</a></details><details><summary>${t('Где посмотреть статус авторизации?','Where can I see authentication status?')}</summary><p>${t('Вход через собственный движок ожидает одобрения Minecraft API и последующего тестирования.','Independent engine sign-in awaits Minecraft API approval and subsequent testing.')}</p></details><div class="block">${status()}</div></div>`,privacy:()=>`<div class="wrap">${head('Конфиденциальность','Privacy','Черновик для согласования, не действующая политика.','Review draft, not an effective policy.')}<div class="card"><p>${t('Лаунчер проектируется с использованием Microsoft OAuth Device Code Flow. Точные категории данных, хранение токенов, сроки хранения и контакты оператора требуют подтверждения перед публикацией политики.','The launcher is designed around Microsoft OAuth device code flow. Data categories, token storage, retention and operator contact require verification before publication.')}</p></div></div>`,terms:()=>`<div class="wrap">${head('Условия использования','Terms','Черновик для согласования, не действующие условия.','Review draft, not effective terms.')}<div class="card"><p>${t('Voxel Pulse — независимый проект. Для игры необходима соответствующая лицензия Minecraft. Окончательные условия распространения и сведения об операторе требуют проверки.','Voxel Pulse is independent. An appropriate Minecraft entitlement is required to play. Final distribution terms and operator details require review.')}</p><a href="https://www.minecraft.net/eula">Minecraft EULA ↗</a></div></div>`};

{key:'profiles',ru:'Профили и оптимизация',en:'Profiles and optimization',rd:'Пять профилей и расширенные параметры запуска.',ed:'Five presets and advanced launch options.',pic:'6',rows:[['Экономичный / Баланс','Power saving / Balanced','Подходы для ограниченных ресурсов или обычной игры.','Options for limited resources or general play.'],['Производительность / Качество графики / Максимальная стабильность','Performance / Graphics quality / Maximum stability','Разные приоритеты настройки. Прирост FPS не гарантирован.','Different configuration priorities. FPS improvement is not guaranteed.'],['G1 / ZGC','G1 / ZGC','Альтернативные сборщики мусора; включение ZGC отключает настройку G1.','Alternative garbage collectors; enabling ZGC supersedes G1 settings.'],['Дедупликация строк','String deduplication','Может снижать расход памяти ценой дополнительной фоновой работы.','May reduce memory use at the cost of extra background work.'],['Выделять всю память сразу','Preallocate memory','Может уменьшить паузы расширения кучи, но занимает память заранее.','May reduce heap expansion pauses but reserves memory earlier.'],['Приоритет процесса / EcoQoS','Process priority / EcoQoS','Параметры поведения процесса под Windows. Эффект зависит от системы.','Windows process behavior options. Effects depend on the system.'],['Журнал пауз GC','GC pause log','Источник данных о сборке мусора для мониторинга.','A garbage collection data source for monitoring.']],note:['Пользовательские профили относятся к отдельной сборке. Не меняй все параметры одновременно: сравнивай результат на одинаковом сценарии.','Custom profiles belong to individual instances. Change options gradually and compare the same workload.']},

function guidePage(key=''){const current=guides.find(g=>g.key===key);return `<div class="wrap">${head('Руководство Voxel Pulse','Voxel Pulse guide','Настройки, инструкции и ответы на вопросы по версии 0.1.0.','Settings, tutorials and answers for version 0.1.0.')}<div class="guide-layout"><aside class="guide-nav"><h3>${t('База знаний','Knowledge base')}</h3><input type="search" id="guideSearch" placeholder="${t('Найти статью…','Find an article…')}" aria-label="${t('Поиск статей','Search articles')}"><div id="guideLinks"><a class="${!current?'active':''}" href="#guide">${t('Все инструкции','All guides')}</a>${guides.map(g=>`<a class="${current===g?'active':''}" href="#guide-${g.key}" data-search="${g.ru.toLowerCase()} ${g.en.toLowerCase()} ${g.rd.toLowerCase()} ${g.ed.toLowerCase()}">${t(g.ru,g.en)}</a>`).join('')}</div><p id="guideEmpty" class="guide-search-empty" hidden>${t('Нет совпадений','No results')}</p></aside><article class="guide-body">${current?`<div class="article-tag">${t('Инструкция','Guide')} · 0.1.0</div><h2>${t(current.ru,current.en)}</h2><p>${t(current.rd,current.ed)}</p>${current.pic?shot(current.pic,current.ru,current.en):''}${current.steps?`<h3>${t('Порядок действий','Steps')}</h3><ol>${current.steps.map(x=>`<li>${t(...x)}</li>`).join('')}</ol>`:''}${current.rows?`<table class="guide-table"><thead><tr><th>${t('Настройка','Setting')}</th><th>${t('Что делает','What it does')}</th></tr></thead><tbody>${current.rows.map(x=>`<tr><td>${t(x[0],x[1])}</td><td>${t(x[2],x[3])}</td></tr>`).join('')}</tbody></table>`:''}${current.note?`<div class="notice">${t(...current.note)}</div>`:''}<div class="guide-links"><a class="btn" href="#guide">← ${t('Все инструкции','All guides')}</a><a class="btn" href="#support">${t('Поддержка','Support')} →</a></div>`:`<h2>${t('Что хочешь настроить?','What do you want to configure?')}</h2><div class="guide-home">${guides.map(g=>`<a href="#guide-${g.key}"><h3>${t(g.ru,g.en)} →</h3><p>${t(g.rd,g.ed)}</p></a>`).join('')}</div>`}<
